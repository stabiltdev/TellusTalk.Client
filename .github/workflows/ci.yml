name: ci

on:
  pull_request:
  push:
    branches: [ 'main' ]
    tags: [ 'v*' ]

# A new push to a pull request cancels the run for the push before it. Each push to main and each tag runs to the end.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The tests start TellusTalk Emulator with Testcontainers, on the runner's own Docker.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Stabilt.TellusTalk.Client.slnx

      - name: Build
        run: dotnet build Stabilt.TellusTalk.Client.slnx -c Release --no-restore

      - name: Format
        run: dotnet format Stabilt.TellusTalk.Client.slnx --verify-no-changes --no-restore

      - name: Test
        run: dotnet test --solution Stabilt.TellusTalk.Client.slnx -c Release --no-build

  # A version tag publishes both packages under the version without its v; the test projects are not packable.
  nuget:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Pack
        run: dotnet pack Stabilt.TellusTalk.Client.slnx -c Release -o packages "-p:Version=${GITHUB_REF_NAME#v}"

      # nuget.org's Trusted Publishing policy names this repository and this file, ci.yml, so renaming the file stops the
      # publishing. The key it hands out lasts an hour, so it is asked for just before the push.
      - name: Log in to nuget.org
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push it to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "packages/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
